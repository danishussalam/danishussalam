<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Design 4 - Minimal Clean</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white">
  <div class="min-h-screen p-8 bg-gray-50">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-4xl font-bold mb-12 text-gray-900">Design 4: Minimal Clean</h1>

      <!-- Tool Container -->
      <div class="grid md:grid-cols-2 gap-12">

        <!-- LEFT SIDE: INPUT -->
        <div class="bg-white rounded-3xl p-10 border-2 border-gray-500 flex flex-col">
          <div class="mb-6">
            <label class="block text-sm font-bold text-gray-900 mb-4 uppercase tracking-wide">Select Framework</label>
            <select class="w-full px-5 py-3 border-2 border-gray-500 rounded-xl text-gray-700 focus:outline-none focus:border-gray-900 bg-white font-medium">
              <option>-- Choose a framework --</option>
              <option>ROSE</option>
              <option>APE</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="block text-sm font-bold text-gray-900 mb-2 uppercase tracking-wide">Your Task or Idea</label>
            <p class="text-xs text-gray-600 font-semibold mb-3">Be as specific as possible for better results</p>
          </div>

          <div class="mb-8 flex-grow">
            <textarea class="w-full px-5 py-4 border-2 border-gray-500 rounded-xl text-gray-700 focus:outline-none focus:border-gray-900 bg-white resize-none" rows="8" placeholder="Write a detailed description of what you want the AI to do..."></textarea>
          </div>

          <button class="w-full bg-gray-900 hover:bg-black text-white font-bold py-5 rounded-xl transition-colors text-base">
            Generate Refined Prompt
          </button>
        </div>

        <!-- RIGHT SIDE: OUTPUT -->
        <div class="bg-white rounded-3xl p-10 border-2 border-gray-500 flex flex-col">
          <div class="mb-6">
            <div class="bg-gray-900 text-white rounded-xl p-6">
              <p class="text-xs font-bold opacity-70 mb-2 uppercase tracking-wide">Generated Output</p>
              <h3 class="text-xl font-bold">Your Refined Prompt</h3>
            </div>
          </div>

          <div class="mb-3">
            <label class="block text-sm font-bold text-gray-900 mb-2 uppercase tracking-wide">System Prompt</label>
          </div>

          <div class="mb-8 flex-grow">
            <div class="bg-white p-5 rounded-xl border-2 border-gray-500 h-full text-sm text-gray-700 leading-relaxed">
              <p class="text-gray-400">Generated system prompt will appear here...</p>
            </div>
          </div>

          <button class="w-full bg-gray-900 hover:bg-black text-white font-bold py-5 rounded-xl transition-colors text-base">
            📋 Copy to Clipboard
          </button>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
