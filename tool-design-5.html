<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Design 5 - Soft Rounded</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white">
  <div class="min-h-screen p-8 bg-gray-50">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-4xl font-bold mb-12 text-gray-900">Design 5: Soft Rounded</h1>

      <!-- Tool Container -->
      <div class="grid md:grid-cols-2 gap-10">

        <!-- LEFT SIDE: INPUT -->
        <div class="bg-gray-100 rounded-3xl p-10 border border-gray-300 shadow-lg">
          <div class="mb-8">
            <label class="block text-sm font-bold text-gray-900 mb-3">Select Framework</label>
            <select class="w-full px-5 py-3 border border-gray-300 rounded-2xl text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option>-- Choose a framework --</option>
              <option>ROSE</option>
              <option>APE</option>
            </select>
          </div>

          <div class="mb-8">
            <label class="block text-sm font-bold text-gray-900 mb-3">Your Task or Idea</label>
            <textarea class="w-full px-5 py-4 border border-gray-300 rounded-2xl text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white resize-none" rows="9" placeholder="Write a detailed description of what you want the AI to do..."></textarea>
            <p class="text-xs text-blue-700 mt-3 font-medium">Be as specific as possible for better results</p>
          </div>

          <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-colors text-base shadow-md">
            Generate Refined Prompt
          </button>
        </div>

        <!-- RIGHT SIDE: OUTPUT -->
        <div class="bg-gray-100 rounded-3xl p-10 border border-gray-300 shadow-lg">
          <div class="mb-8">
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-2xl p-5 mb-8 shadow-md">
              <p class="text-xs font-bold opacity-80 mb-1 uppercase tracking-wide">Generated Output</p>
              <h3 class="text-xl font-bold">Your Refined Prompt</h3>
            </div>
          </div>

          <div class="mb-8">
            <p class="text-xs font-bold text-gray-700 mb-3 uppercase tracking-wide">System Prompt</p>
            <div class="bg-white p-6 rounded-2xl border border-gray-300 min-h-[290px] text-sm text-gray-700 leading-relaxed shadow-sm">
              <p class="text-gray-400">Generated system prompt will appear here...</p>
            </div>
          </div>

          <button class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-4 rounded-2xl transition-colors text-base">
            📋 Copy to Clipboard
          </button>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
