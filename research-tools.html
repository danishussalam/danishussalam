  <script>
    // Highlight active nav link
    document.addEventListener('DOMContentLoaded', function() {
      const current = window.location.pathname.split('/').pop() || 'index.html';
      const navLinks = document.querySelectorAll('nav a[href]');
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href === current || (current === '' && href === 'index.html')) {
          link.style.color = '#000';
          link.style.fontWeight = '600';
        }
      });
    });
  </script>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">

      <h2 id="modalTitle" class="text-[20px] font-bold text-gray-900 mb-2"></h2>
      <p id="modalDesc" class="text-[13px] text-gray-600 mb-6 leading-relaxed"></p>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg text-gray-700 font-semibold text-[13px] hover:bg-gray-50 transition-colors">
          Cancel
        </button>
        <button id="launchBtn" class="flex-1 px-4 py-2.5 bg-du-blue text-white rounded-lg font-semibold text-[13px] hover:bg-[#0858b8] transition-colors">
          Launch Tool
        </button>
      </div>
    </div>
  </div>

  <script>
    function openModal(url, title, description) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = description;
      document.getElementById('launchBtn').onclick = () => window.location.href = url;
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('modal').addEventListener('click', (e) => {
        if (e.target.id === 'modal') closeModal();
      });
    });
  </script>
