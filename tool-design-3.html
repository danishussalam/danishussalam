<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Design 3 - Gradient Modern</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white">
  <div class="min-h-screen p-8 bg-white">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-4xl font-bold mb-12 text-gray-900">Design 3: Gradient Modern</h1>

      <!-- Tool Container -->
      <div class="grid md:grid-cols-2 gap-8">

        <!-- LEFT SIDE: INPUT -->
        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl p-8 border border-blue-200">
          <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-900 mb-3">Select Framework</label>
            <select class="w-full px-4 py-3 border border-blue-300 rounded-lg text-gray-700 focus:outline-none focus:border-blue-500 bg-white">
              <option>-- Choose a framework --</option>
              <option>ROSE</option>
              <option>APE</option>
            </select>
          </div>

          <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-900 mb-3">Your Task or Idea</label>
            <textarea class="w-full px-4 py-4 border border-blue-300 rounded-lg text-gray-700 focus:outline-none focus:border-blue-500 bg-white resize-none" rows="8" placeholder="Write a detailed description of what you want the AI to do..."></textarea>
            <p class="text-xs text-blue-700 mt-2 font-medium">Be as specific as possible for better results</p>
          </div>

          <button class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-4 rounded-lg transition-all">
            Generate Refined Prompt
          </button>
        </div>

        <!-- RIGHT SIDE: OUTPUT -->
        <div class="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl p-8 border border-emerald-200">
          <div class="mb-6">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-lg p-4 mb-6">
              <p class="text-xs font-semibold opacity-90 mb-1">Generated Output</p>
              <h3 class="text-lg font-bold">Your Refined Prompt</h3>
            </div>
          </div>

          <div class="mb-6">
            <p class="text-xs font-semibold text-emerald-700 mb-3 uppercase tracking-wide">System Prompt</p>
            <div class="bg-white p-4 rounded-lg border border-emerald-200 min-h-[250px] text-sm text-gray-700 leading-relaxed">
              <p class="text-gray-400">Generated system prompt will appear here...</p>
            </div>
          </div>

          <button class="w-full bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-semibold py-3 rounded-lg transition-colors">
            📋 Copy to Clipboard
          </button>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
