<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Design 2 - Dark Elegant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white">
  <div class="min-h-screen p-8 bg-gray-50">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-4xl font-bold mb-12 text-gray-900">Design 2: Dark Elegant</h1>

      <!-- Tool Container -->
      <div class="grid md:grid-cols-2 gap-10">

        <!-- LEFT SIDE: INPUT -->
        <div class="bg-[#f8f7f6] rounded-3xl p-8 border border-gray-200">
          <div class="mb-8">
            <label class="block text-sm font-semibold text-gray-900 mb-3">Select Framework</label>
            <select class="w-full px-4 py-3 border border-gray-300 rounded-xl text-gray-700 focus:outline-none focus:border-gray-900 bg-white">
              <option>-- Choose a framework --</option>
              <option>ROSE</option>
              <option>APE</option>
            </select>
          </div>

          <div class="mb-8">
            <label class="block text-sm font-semibold text-gray-900 mb-3">Your Task or Idea</label>
            <textarea class="w-full px-4 py-4 border border-gray-300 rounded-xl text-gray-700 focus:outline-none focus:border-gray-900 bg-white resize-none" rows="9" placeholder="Write a detailed description of what you want the AI to do..."></textarea>
            <p class="text-xs text-amber-700 mt-2 font-medium">Be as specific as possible for better results</p>
          </div>

          <button class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-4 rounded-xl transition-colors">
            Generate Refined Prompt
          </button>
        </div>

        <!-- RIGHT SIDE: OUTPUT -->
        <div class="bg-[#f8f7f6] rounded-3xl p-8 border border-gray-200">
          <div class="mb-8">
            <div class="bg-gray-900 text-white rounded-xl p-5 mb-8">
              <p class="text-xs font-semibold opacity-80 mb-1">Generated Output</p>
              <h3 class="text-lg font-bold">Your Refined Prompt</h3>
            </div>
          </div>

          <div class="mb-8">
            <p class="text-xs font-semibold text-gray-700 mb-3 uppercase tracking-wide">System Prompt</p>
            <div class="bg-white p-5 rounded-xl border border-gray-200 min-h-[280px] text-sm text-gray-700 leading-relaxed">
              <p class="text-gray-400">Generated system prompt will appear here...</p>
            </div>
          </div>

          <button class="w-full bg-gray-100 hover:bg-gray-200 text-gray-900 font-semibold py-3 rounded-xl transition-colors">
            📋 Copy to Clipboard
          </button>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
